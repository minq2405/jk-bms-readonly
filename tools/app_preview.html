<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>JK BMS Read-Only — Tổng quan giao diện App (Redmi Note 5)</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@500;600;700&family=Fira+Sans:wght@400;500;600;700&display=swap');

  :root {
    --canvas-bg: #060910;
    --bar-bg: #0e1420;
    --bar-border: #1e293b;
    --accent: #22d3ee;
    --accent-soft: rgba(34, 211, 238, 0.14);
    --charge: #22c55e;
    --discharge: #f59e0b;
    --danger: #ef4444;

    /* App OLED Theme (from ui_layout.json) */
    --app-bg: #000000;
    --app-card: #121212;
    --app-card-elevated: #181c24;
    --app-card-border: #262d3d;
    --app-text: #ffffff;
    --app-muted: #b8c4d4;
    --radius: 14px;
    --font-ui: 'Fira Sans', 'Segoe UI', system-ui, sans-serif;
    --font-num: 'Fira Code', ui-monospace, Consolas, monospace;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: var(--font-ui);
    background: var(--canvas-bg);
    color: #f1f5f9;
    min-height: 100vh;
  }

  .num { font-family: var(--font-num); font-variant-numeric: tabular-nums; }
  svg.ico { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }
  svg.ico-lg { width: 18px; height: 18px; }

  /* Slim Top Bar */
  .topbar {
    position: sticky;
    top: 0;
    z-index: 50;
    height: 54px;
    background: rgba(14, 20, 32, 0.94);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--bar-border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 20px;
    gap: 12px;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    font-weight: 700;
    font-size: 14px;
  }
  .tag {
    font-size: 10px;
    font-weight: 700;
    padding: 3px 8px;
    border-radius: 999px;
    background: var(--accent-soft);
    color: var(--accent);
    border: 1px solid rgba(34, 211, 238, 0.35);
  }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .btn {
    min-height: 36px;
    background: #172133;
    color: #f1f5f9;
    border: 1px solid #26344b;
    border-radius: 8px;
    padding: 6px 12px;
    font-size: 12px;
    font-weight: 600;
    font-family: var(--font-ui);
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .btn:hover { background: #223049; }

  /* Showcase Grid */
  .showcase {
    max-width: 1580px;
    margin: 0 auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 28px;
  }
  .row-section {
    display: flex;
    flex-wrap: wrap;
    gap: 22px;
    align-items: flex-start;
    justify-content: center;
  }
  .section-heading {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.9px;
    color: #94a3b8;
    font-weight: 700;
    margin-bottom: 12px;
    text-align: center;
  }

  .device-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
  }
  .device-label {
    font-size: 12.5px;
    font-weight: 700;
    color: #e2e8f0;
  }
  .device-sub {
    font-size: 11px;
    color: #94a3b8;
    font-family: var(--font-num);
  }
  .phone-shell {
    background: #020305;
    border: 3px solid #2b374d;
    border-radius: 26px;
    padding: 9px;
    box-shadow: 0 22px 54px rgba(0, 0, 0, 0.65);
    display: flex;
    flex-direction: column;
  }
  .phone-screen {
    flex: 1;
    border-radius: 16px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    background: #000;
  }
  .phone-screen.landscape { flex-direction: row; }

  /* Simulated Google Maps */
  .maps-pane {
    background: linear-gradient(155deg, #172334 0%, #101b29 60%, #152536 100%);
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 10px 12px;
    color: #f1f5f9;
  }
  .maps-grid {
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(to right, rgba(148,163,184,0.08) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(148,163,184,0.08) 1px, transparent 1px);
    background-size: 28px 28px;
  }
  .maps-route { position: absolute; inset: 0; width: 100%; height: 100%; }
  .maps-banner {
    position: relative; z-index: 2;
    background: #0f766e; color: #fff;
    padding: 6px 10px; border-radius: 10px;
    font-size: 11px; font-weight: 700;
    display: flex; justify-content: space-between; align-items: center;
  }
  .maps-footer {
    position: relative; z-index: 2;
    background: rgba(15, 23, 42, 0.92);
    border: 1px solid rgba(148,163,184,0.25);
    border-radius: 10px; padding: 5px 10px;
    font-size: 11px; display: flex; justify-content: space-between;
  }
  .split-handle { background: #05070b; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .split-handle.h { height: 10px; width: 100%; }
  .split-handle.v { width: 10px; height: 100%; }
  .split-pill { background: #64748b; border-radius: 999px; }
  .split-handle.h .split-pill { width: 36px; height: 4px; }
  .split-handle.v .split-pill { width: 4px; height: 36px; }

  /* Actual App UI */
  .app-pane {
    background: var(--app-bg);
    color: var(--app-text);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .app-header {
    min-height: 40px;
    padding: 6px 10px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid var(--app-card-border);
    background: var(--app-card);
    flex-shrink: 0;
  }
  .app-header-left {
    display: flex; align-items: center; gap: 7px;
    font-size: 12px; font-weight: 700;
    min-width: 0; flex: 1;
  }
  .bms-name-ellipsis {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    min-width: 0;
  }
  .dot-live {
    width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0;
    background: var(--charge); box-shadow: 0 0 8px var(--charge);
  }
  .pill-ro {
    font-size: 10px;
    padding: 3px 8px;
    border-radius: 999px;
    background: var(--app-card-elevated);
    border: 1px solid var(--app-card-border);
    color: var(--app-muted);
    font-weight: 600;
    display: inline-flex;
    align-items: center;
    gap: 4px;
  }
  .pill-btn {
    min-height: 36px;
    font-size: 10.5px;
    padding: 4px 10px;
    border-radius: 999px;
    background: var(--app-card-elevated);
    border: 1px solid var(--app-card-border);
    color: var(--app-muted);
    font-weight: 600;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    flex-shrink: 0;
  }
  .pill-btn.active { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }

  .app-scroll {
    flex: 1;
    overflow-y: auto;
    padding: 8px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    min-height: 0;
  }
  .app-scroll::-webkit-scrollbar { width: 4px; }
  .app-scroll::-webkit-scrollbar-thumb { background: rgba(148,163,184,0.28); border-radius: 4px; }

  .card {
    background: var(--app-card);
    border: 1px solid var(--app-card-border);
    border-radius: var(--radius);
    padding: 10px 11px;
  }
  .card-label {
    font-size: 11px;
    color: var(--app-muted);
    font-weight: 600;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
    margin-bottom: 7px;
  }
  .card-label-left { display: inline-flex; align-items: center; gap: 5px; min-width: 0; }

  /* Full-width balanced rows inside span:2 cards (safe wrap on ultra-narrow widths) */
  .card-row-split {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 10px 12px;
  }
  .big-val {
    font-family: var(--font-num);
    font-variant-numeric: tabular-nums;
    font-size: 23px;
    font-weight: 700;
    letter-spacing: -0.5px;
    line-height: 1.1;
  }
  .sub-val {
    font-size: 11.5px;
    color: var(--app-muted);
    margin-top: 3px;
  }
  .kpi-right {
    text-align: right;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 3px;
    margin-left: auto;
  }

  .mos-pills { display: flex; flex-wrap: wrap; gap: 6px; }
  .mos-pill {
    font-size: 10.5px;
    font-weight: 600;
    padding: 4px 8px;
    border-radius: 8px;
    border: 1px solid var(--app-card-border);
    background: var(--app-card-elevated);
    color: var(--app-text);
  }
  .mos-on {
    background: rgba(34, 197, 94, 0.14);
    color: #4ade80;
    border-color: rgba(34, 197, 94, 0.42);
  }
  .mos-warn {
    background: rgba(245, 158, 11, 0.15);
    color: #fbbf24;
    border-color: rgba(245, 158, 11, 0.45);
  }

  /* 24-Cell Grid (4 cols default, adaptive via classes) */
  .cell-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .app-compact .cell-grid { grid-template-columns: repeat(3, 1fr); }
  .app-tablet .cell-grid { grid-template-columns: repeat(6, 1fr); }
  .cell-item {
    background: var(--app-card-elevated);
    border: 1px solid var(--app-card-border);
    border-radius: 8px;
    padding: 4px 6px;
    font-size: 10.5px;
  }
  .cell-item.is-max { border-color: #ef4444; background: rgba(239, 68, 68, 0.15); }
  .cell-item.is-min { border-color: #d97706; background: rgba(245, 158, 11, 0.14); }
  .cell-item.is-max .cell-top span:last-child { color: #ef4444; }
  .cell-item.is-min .cell-top span:last-child { color: #fbbf24; }
  .cell-top { display: flex; justify-content: space-between; color: var(--app-muted); font-size: 10.5px; font-weight: 600; }
  .cell-v { font-family: var(--font-num); font-weight: 700; font-size: 11px; margin-top: 2px; }
  .cell-bar-bg { height: 3px; background: rgba(148,163,184,0.22); border-radius: 2px; margin-top: 3px; overflow: hidden; }
  .cell-bar-fill { height: 100%; border-radius: 2px; }

  /* Bottom Nav >= 48dp */
  .app-bottom-nav {
    display: flex;
    border-top: 1px solid var(--app-card-border);
    background: var(--app-card);
    padding: 4px 8px;
    gap: 6px;
    flex-shrink: 0;
  }
  .app-compact .app-bottom-nav { padding: 4px 5px; gap: 3px; }
  .nav-item {
    flex: 1;
    min-height: 48px;
    border: none;
    background: transparent;
    color: var(--app-muted);
    font-size: 10.5px;
    font-weight: 600;
    font-family: var(--font-ui);
    padding: 4px 2px;
    border-radius: 10px;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 3px;
    white-space: nowrap;
  }
  .app-compact .nav-item { font-size: 9.5px; }
  .nav-item.active { background: var(--accent-soft); color: var(--accent); }

  /* Navigation Rail for Landscape & Tablet */
  .app-body-with-rail {
    flex: 1;
    display: flex;
    min-height: 0;
    overflow: hidden;
  }
  .app-nav-rail {
    width: 62px;
    border-right: 1px solid var(--app-card-border);
    background: var(--app-card);
    padding: 6px 4px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    gap: 4px;
    flex-shrink: 0;
  }
  .app-nav-rail .nav-item {
    flex: 1;
    min-height: 48px;
    font-size: 9.5px;
    padding: 4px 2px;
  }

  /* 30% Strip HUD */
  .hud-strip {
    height: 100%;
    padding: 6px 8px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    gap: 5px;
    overflow-y: auto;
    min-height: 0;
  }
  .hud-top-row {
    display: flex; align-items: center; justify-content: space-between;
    font-size: 11px; color: var(--app-muted);
    flex-shrink: 0;
  }
  .hud-main-row {
    flex: 1;
    display: grid;
    grid-template-columns: 108px 1fr;
    gap: 8px;
    min-height: 0;
  }
  .hud-strip.narrow .hud-main-row { grid-template-columns: 1fr; }
  .hud-soc-card {
    background: var(--app-card);
    border: 1px solid var(--app-card-border);
    border-radius: 12px;
    padding: 6px 4px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 3px;
  }
  .hud-metrics-2x2 { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .hud-strip.narrow .hud-metrics-2x2 { grid-template-columns: 1fr; }
  .hud-mini-box {
    background: var(--app-card);
    border: 1px solid var(--app-card-border);
    border-radius: 10px;
    padding: 5px 8px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    min-width: 0;
  }
  .hud-mini-label { font-size: 10.5px; color: var(--app-muted); display: flex; align-items: center; gap: 4px; font-weight: 600; }
  .hud-mini-val { font-family: var(--font-num); font-size: 15px; font-weight: 700; margin-top: 2px; }

  /* Compact 50/50 Split: Fit SOC + Power + Temps&MOS together on screen */
  .app-split50 .app-header { min-height: 34px; padding: 3px 10px; }
  .app-split50 .app-bottom-nav { padding: 2px 6px; }
  .app-split50 .nav-item { min-height: 44px; padding: 2px; gap: 2px; font-size: 10px; }
  .app-split50 .app-scroll { padding: 6px; gap: 6px; }
  .app-split50 .card { padding: 6px 10px; }
  .app-split50 .card-label { font-size: 10.5px; margin-bottom: 4px; line-height: 1.2; }
  .app-split50 .soc-ring-svg { width: 54px; height: 54px; }
  .app-split50 .power-arc-svg { width: 80px; height: 44px; }
  .app-split50 .big-val { font-size: 19px; }
  .app-split50 .sub-val { font-size: 10.5px; margin-top: 1px; }
  .app-split50 .kpi-right { gap: 1px; }
  .app-split50 .mos-pills { gap: 4px; }
  .app-split50 .mos-pill { font-size: 10px; padding: 2px 6px; border-radius: 6px; line-height: 1.3; }

  /* Non-distorting Chart Dot */
  .chart-wrap { position: relative; width: 100%; }
  .chart-dot {
    position: absolute;
    right: -3px;
    width: 7px;
    height: 7px;
    border-radius: 50%;
    transform: translateY(-50%);
    pointer-events: none;
  }

  /* Secondary screens */
  .ro-group {
    background: var(--app-card);
    border: 1px solid var(--app-card-border);
    border-radius: 12px;
    padding: 8px 10px;
  }
  .ro-group-title { font-size: 11px; font-weight: 700; color: var(--accent); margin-bottom: 5px; display: flex; justify-content: space-between; gap: 8px; }
  .ro-row { display: flex; justify-content: space-between; align-items: baseline; flex-wrap: wrap; gap: 4px 10px; padding: 4px 0; border-bottom: 1px dashed var(--app-card-border); font-size: 11px; }
  .ro-row:last-child { border-bottom: none; }
  .ro-k { color: var(--app-muted); }
  .ro-v { font-family: var(--font-num); font-weight: 700; text-align: right; margin-left: auto; }

  .pass-input {
    width: 100%;
    background: var(--app-card-elevated);
    border: 1px solid var(--accent);
    color: var(--app-text);
    border-radius: 10px;
    padding: 10px;
    font-family: var(--font-num);
    font-size: 16px;
    text-align: center;
    letter-spacing: 4px;
  }
  .btn-app-primary {
    width: 100%;
    min-height: 44px;
    border: none;
    border-radius: 10px;
    background: var(--accent);
    color: #000;
    font-weight: 700;
    font-size: 13px;
    font-family: var(--font-ui);
    cursor: pointer;
  }
  .inapp-2col {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }
  .wide-2col-top {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }
  .wide-2col-top .big-val { font-size: 17px; }
  .wide-2col-top .sub-val { font-size: 10.5px; }
  .wide-2col-top .kpi-right {
    width: 100%;
    flex-direction: row;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: center;
    text-align: left;
    margin-left: 0;
    padding-top: 6px;
    border-top: 1px dashed var(--app-card-border);
  }
  .tablet-bento {
    display: grid;
    grid-template-columns: 280px 1fr;
    gap: 8px;
    align-items: start;
  }
  .connect-search-row {
    display: flex;
    gap: 6px;
    align-items: center;
    flex-wrap: wrap;
  }
  .connect-search-box {
    flex: 1 1 150px;
    min-width: 0;
    min-height: 36px;
    display: flex;
    align-items: center;
    gap: 6px;
    background: var(--app-card-elevated);
    border: 1px solid var(--app-card-border);
    border-radius: 9px;
    padding: 6px 9px;
    font-size: 11.5px;
    color: var(--app-muted);
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">
    <svg class="ico ico-lg" style="color:var(--accent)" viewBox="0 0 24 24"><rect x="2" y="7" width="18" height="10" rx="2"/><path d="M22 11v2"/><path d="M11 10l-2 3h4l-2 3"/></svg>
    <span>JK BMS Read-Only — Tổng quan giao diện App thực tế</span>
    <span class="tag">Redmi Note 5 • JK-BD6A24S6PD</span>
  </div>
  <div class="actions">
    <button class="btn" id="btnScenario" onclick="cycleScenario()"></button>
    <button class="btn" id="btnLang" onclick="toggleLang()"></button>
    <span class="tag" style="display:inline-flex; align-items:center; gap:5px; font-size:11px; padding:5px 10px;">OLED Dark</span>
  </div>
</div>

<div class="showcase" id="showcase"></div>

<script>
const SVG = {
  battery: '<svg class="ico" viewBox="0 0 24 24"><rect x="2" y="7" width="18" height="10" rx="2"/><path d="M22 11v2"/><path d="M6 10v4"/><path d="M10 10v4"/></svg>',
  bolt: '<svg class="ico" viewBox="0 0 24 24"><path d="M13 2L4 14h7l-1 8 9-12h-7l1-8z"/></svg>',
  gauge: '<svg class="ico" viewBox="0 0 24 24"><path d="M12 14l4-4"/><path d="M3.34 19a10 10 0 1 1 17.32 0"/></svg>',
  thermometer: '<svg class="ico" viewBox="0 0 24 24"><path d="M14 14.76V3.5a2.5 2.5 0 0 0-5 0v11.26a4.5 4.5 0 1 0 5 0z"/></svg>',
  grid: '<svg class="ico" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>',
  chart: '<svg class="ico" viewBox="0 0 24 24"><path d="M3 3v18h18"/><path d="M7 15l4-4 4 3 5-6"/></svg>',
  lock: '<svg class="ico" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>',
  delta: '<svg class="ico" viewBox="0 0 24 24"><path d="M12 3L3 20h18L12 3z"/></svg>',
  globe: '<svg class="ico" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M2 12h20"/><path d="M12 2a15 15 0 0 1 0 20 15 15 0 0 1 0-20z"/></svg>',
  moon: '<svg class="ico" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>',
  sun: '<svg class="ico" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.93 4.93l1.41 1.41m11.32 11.32l1.41 1.41M2 12h2m16 0h2M4.93 19.07l1.41-1.41m11.32-11.32l1.41-1.41"/></svg>',
  bt: '<svg class="ico" viewBox="0 0 24 24"><path d="M7 7l10 10-5 5V2l5 5L7 17"/></svg>',
  search: '<svg class="ico" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35"/></svg>',

function t(k) { return I18N[state.lang][k] || k; }

function getData() {
  const base = SCENARIOS[state.scenarioIdx];
  const jitter = state.scenarioIdx === 0 ? 0 : Math.sin(state.tick * 0.45) * 0.7;
  const currentA = base.currentA === 0 ? 0 : +(base.currentA + jitter).toFixed(2);
  const totalV = +(base.totalV - jitter * 0.03).toFixed(3);
  const powerW = +(totalV * currentA).toFixed(1);
  const minV = Math.min(...base.cells);
  const maxV = Math.max(...base.cells);
  const avgV = base.cells.reduce((a, b) => a + b, 0) / base.cells.length;
  return {
    ...base,
    currentA, totalV, powerW,
    minV, maxV, avgV,
    deltaVStr: (maxV - minV).toFixed(3),
    minIdx: base.cells.indexOf(minV) + 1,
    maxIdx: base.cells.indexOf(maxV) + 1
  };
}

function toggleLang() { state.lang = state.lang === 'vi' ? 'en' : 'vi'; render(); }
function cycleScenario() { state.scenarioIdx = (state.scenarioIdx + 1) % SCENARIOS.length; render(); }

function socRingSvg(soc, totalV, size = 76) {
  const r = 30;
  const c = 2 * Math.PI * r;
  const dash = (soc / 100) * c;
  const stroke = soc <= 20 ? '#ef4444' : soc <= 40 ? '#f59e0b' : '#22d3ee';
  const muted = '#cbd5e1';
  return `
    <svg class="soc-ring-svg" width="${size}" height="${size}" viewBox="0 0 76 76" style="flex-shrink:0;">
      <defs>
        <linearGradient id="socGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="${stroke}"/>
          <stop offset="100%" stop-color="#16a34a"/>
        </linearGradient>
      </defs>
      <circle cx="38" cy="38" r="${r}" fill="none" stroke="rgba(148,163,184,0.2)" stroke-width="7"/>
      <circle cx="38" cy="38" r="${r}" fill="none" stroke="url(#socGrad)" stroke-width="7"
        stroke-linecap="round" stroke-dasharray="${dash.toFixed(1)} ${c.toFixed(1)}" transform="rotate(-90 38 38)"/>
      <path d="M39 16l-3 5h3l-1 4 4-5h-3z" fill="${stroke}"/>
      <text x="38" y="42" text-anchor="middle" fill="currentColor" font-family="Fira Code, monospace" font-size="15.5" font-weight="700">${soc}%</text>
      <text x="38" y="54" text-anchor="middle" fill="${muted}" font-family="Fira Code, monospace" font-size="8.5" font-weight="600">${totalV.toFixed(1)}V</text>
    </svg>
  `;
}

function powerArcSvg(currentA, powerW) {
  const ratio = Math.min(1, Math.abs(currentA) / 60);
  const color = currentA > 0.2 ? '#22c55e' : currentA < -0.2 ? '#f59e0b' : '#22d3ee';
  const muted = '#cbd5e1';
  const halfC = Math.PI * 34;
  return `
    <svg class="power-arc-svg" width="94" height="54" viewBox="0 0 88 52" style="flex-shrink:0;">
      <path d="M 10 44 A 34 34 0 0 1 78 44" fill="none" stroke="rgba(148,163,184,0.22)" stroke-width="7" stroke-linecap="round"/>
      <path d="M 10 44 A 34 34 0 0 1 78 44" fill="none" stroke="${color}" stroke-width="7" stroke-linecap="round"
        stroke-dasharray="${(ratio * halfC).toFixed(1)} ${halfC.toFixed(1)}"/>
      <text x="44" y="34" text-anchor="middle" fill="${color}" font-family="Fira Code, monospace" font-size="12.5" font-weight="700">${currentA >= 0 ? '+' : ''}${currentA.toFixed(1)}A</text>
      <text x="44" y="47" text-anchor="middle" fill="${muted}" font-family="Fira Code, monospace" font-size="9" font-weight="600">${powerW >= 0 ? '+' : ''}${Math.round(powerW)}W</text>
    </svg>
  `;
}

function chartSvg(height, metricColor = '#22d3ee', label = 'POWER (W)') {
  const pts = [];
  let lastY = height / 2;
  for (let i = 0; i < 24; i++) {
    const x = (i / 23) * 280;
    const wave = Math.sin((i + state.tick) * 0.45) * 14 + Math.cos((i + state.tick) * 0.2) * 8;
    const y = height / 2 - wave * (height / 95);
    lastY = y;
    pts.push(`${x.toFixed(1)},${y.toFixed(1)}`);
  }
  const gradId = `areaG_${height}_${metricColor.replace('#', '')}`;
  return `
    <div class="card-label">
      <span class="card-label-left">${SVG.chart}<span>${t('miniChart')} (${label})</span></span>
      <span class="num" style="font-size:10px;">1m • 5m • 15m</span>
    </div>
    <div class="chart-wrap">
      <svg width="100%" height="${height}" viewBox="0 0 280 ${height}" preserveAspectRatio="none" style="display:block;">
        <defs>
          <linearGradient id="${gradId}" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="${metricColor}" stop-opacity="0.34"/>
            <stop offset="100%" stop-color="${metricColor}" stop-opacity="0.02"/>
          </linearGradient>
        </defs>
        <line x1="0" y1="${height/2}" x2="280" y2="${height/2}" stroke="rgba(148,163,184,0.22)" stroke-dasharray="4 4"/>
        <polygon points="0,${height} ${pts.join(' ')} 280,${height}" fill="url(#${gradId})"/>
        <polyline points="${pts.join(' ')}" fill="none" stroke="${metricColor}" stroke-width="2.2" vector-effect="non-scaling-stroke" stroke-linecap="round"/>
      </svg>
      <span class="chart-dot" style="top:${((lastY / height) * 100).toFixed(1)}%; background:${metricColor};"></span>
    </div>
  `;
}

function cardCells(d, count = 24, colsOverride = 0) {
  const gridStyle = colsOverride ? `style="grid-template-columns: repeat(${colsOverride}, 1fr);"` : '';
  return `
    <div class="card">
      <div class="card-label">
        <span class="card-label-left">${SVG.grid}<span>${t('cellBars')}</span></span>
        <span class="num" style="font-size:10px; color:var(--app-text)">Δ ${d.deltaVStr} V</span>
      </div>
      <div class="cell-grid" ${gridStyle}>
        ${d.cells.slice(0, count).map((v, i) => {
          const isMax = (i + 1) === d.maxIdx;
          const isMin = (i + 1) === d.minIdx;
          const pct = Math.max(8, Math.min(100, ((v - 2.9) / (3.55 - 2.9)) * 100));
          return `
            <div class="cell-item ${isMax ? 'is-max' : isMin ? 'is-min' : ''}">
              <div class="cell-top"><span class="num">#${i+1}</span><span>${isMax ? 'MAX' : isMin ? 'MIN' : ''}</span></div>
              <div class="cell-v">${v.toFixed(3)}</div>
              <div class="cell-bar-bg"><div class="cell-bar-fill" style="width:${pct.toFixed(0)}%; background:${isMax ? '#ef4444' : isMin ? '#d97706' : '#22d3ee'}"></div></div>
            </div>
          `;
        }).join('')}
      </div>
    </div>
  `;
}
